<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PAL</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            aspect-ratio: 320/200;
            image-rendering: pixelated;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ws = new WebSocket(
            (location.protocol === 'https:' ? 'wss://' : 'ws://') +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            '/ws'
        );
        const keysPressed = new Set();

        let audioCtx, palette, audioConfig = { sampleRate: 44100, channels: 2, bitsPerSample: 16 };
        const audioQueue = [];
        let currentPlayingSource = null, nextScheduledTime = 0;

        function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new (AudioContext || webkitAudioContext)({ sampleRate: audioConfig.sampleRate });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function resizeCanvas() {
            const ratio = 320 / 200;
            let w = innerWidth, h = innerHeight;
            if (w / h > ratio) w = h * ratio;
            else h = w / ratio;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0); // 重設變形
            ctx.imageSmoothingEnabled = true;   // 關閉平滑，保留像素風格
        }
        resizeCanvas();
        addEventListener('resize', resizeCanvas);

        function initAudio() {
            if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)({ sampleRate: audioConfig.sampleRate });
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function scheduleNextBuffer() {
            if (!audioQueue.length || !audioCtx) return;
            const { buffer } = audioQueue.shift();
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            const startTime = Math.max(audioCtx.currentTime + 0.01, nextScheduledTime);
            nextScheduledTime = startTime + buffer.duration;
            source.onended = () => {
                if (currentPlayingSource === source) currentPlayingSource = null;
                scheduleNextBuffer();
            };
            currentPlayingSource = source;
            source.start(startTime);
            if (audioQueue.length) setTimeout(scheduleNextBuffer, 10);
        }

        ws.onmessage = async event => {
            const data = new Uint8Array(await event.data.arrayBuffer());
            if (data[0] === 2) {
                palette = data.slice(1);
            } else if (data[0] === 0 && palette) {
                const gameWidth = (data[1] << 8) | data[2];
                const gameHeight = (data[3] << 8) | data[4];
                const imageData = ctx.createImageData(gameWidth, gameHeight);
                const pixels = imageData.data, indices = data.slice(5);
                for (let i = 0; i < indices.length; i++) {
                    const idx = indices[i] * 3, p = i * 4;
                    pixels[p] = palette[idx];
                    pixels[p + 1] = palette[idx + 1];
                    pixels[p + 2] = palette[idx + 2];
                    pixels[p + 3] = 255;
                }
                const dpr = window.devicePixelRatio || 1;
                const offscreen = document.createElement('canvas');
                offscreen.width = gameWidth;
                offscreen.height = gameHeight;
                offscreen.getContext('2d').putImageData(imageData, 0, 0);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const scale = Math.min(canvas.width / gameWidth, canvas.height / gameHeight);
                const dx = (canvas.width - gameWidth * scale) / 2;
                const dy = (canvas.height - gameHeight * scale) / 2;
                ctx.setTransform(scale, 0, 0, scale, dx, dy);
                ctx.drawImage(offscreen, 0, 0);
            } else if (data[0] === 3) {
                const newConfig = {
                    sampleRate: (data[1] << 8) | data[2],
                    channels: data[3],
                    bitsPerSample: data[4]
                };
                if (JSON.stringify(newConfig) !== JSON.stringify(audioConfig)) {
                    if (audioCtx) await audioCtx.close();
                    audioConfig = newConfig;
                    audioQueue.length = 0;
                    nextScheduledTime = 0;
                    initAudio();
                }
            } else if (data[0] === 1) {
                if (audioQueue.length > 1) audioQueue.shift();
                const { sampleRate, channels, bitsPerSample } = audioConfig;
                const bytesPerFrame = channels * (bitsPerSample / 8);
                const sampleCount = Math.floor((data.length - 1) / bytesPerFrame);
                if (sampleCount > 0) {
                    try {
                        const audioBuffer = audioCtx.createBuffer(channels, sampleCount, sampleRate);
                        if (bitsPerSample === 16) {
                            const pcmData = new Int16Array(data.buffer.slice(1));
                            for (let ch = 0; ch < channels; ch++) {
                                const channelData = audioBuffer.getChannelData(ch);
                                for (let i = 0; i < sampleCount; i++) {
                                    channelData[i] = pcmData[i * channels + ch] / 32768;
                                }
                            }
                        } else {
                            const pcmData = new Uint8Array(data.buffer.slice(1));
                            for (let ch = 0; ch < channels; ch++) {
                                const channelData = audioBuffer.getChannelData(ch);
                                for (let i = 0; i < sampleCount; i++) {
                                    channelData[i] = (pcmData[i * channels + ch] - 128) / 128;
                                }
                            }
                        }
                        audioQueue.push({ buffer: audioBuffer });
                        if (!currentPlayingSource) scheduleNextBuffer();
                    } catch (e) { }
                }
            }
        };

        document.addEventListener('keydown', e => {
            if (keysPressed.has(e.key)) return;
            keysPressed.add(e.key);
            ws.send(`0${e.key}`);
        });
        document.addEventListener('keyup', e => {
            if (!keysPressed.has(e.key)) return;
            keysPressed.delete(e.key);
            ws.send(`1${e.key}`);
        });
        document.addEventListener('keydown', ensureAudioContext);
        document.addEventListener('mousedown', ensureAudioContext);
        document.addEventListener('touchstart', ensureAudioContext);
    </script>
</body>

</html>
