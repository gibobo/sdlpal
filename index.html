<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PAL</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center
        }

        canvas {
            object-fit: contain;
            aspect-ratio: 320/200;
            image-rendering: pixelated
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ws = new WebSocket('ws://localhost:8000/ws');
        const keysPressed = new Set();

        let audioCtx, palette, audioConfig = { sampleRate: 44100, channels: 2, bitsPerSample: 16 };
        const audioQueue = [];
        let currentPlayingSource = null;
        let nextScheduledTime = 0;
        let userInteracted = false;
        const MAX_QUEUE_LENGTH = 1;

        function resizeCanvas() {
            const ratio = 320 / 200;
            let w = innerWidth, h = innerHeight;
            if (w / h > ratio) w = h * ratio;
            else h = w / ratio;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        }

        resizeCanvas();
        addEventListener('resize', resizeCanvas);

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (AudioContext || webkitAudioContext)({ sampleRate: audioConfig.sampleRate });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function initAudioOnUserInteraction() {
            if (!userInteracted) {
                userInteracted = true;
                initAudio();
                scheduleNextBuffer();
            }
        }

        function scheduleNextBuffer() {
            if (!audioQueue.length || !userInteracted || !audioCtx) return;

            const { buffer } = audioQueue.shift();
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);

            const currentTime = audioCtx.currentTime;
            const startTime = Math.max(currentTime + 0.01, nextScheduledTime);
            nextScheduledTime = startTime + buffer.duration;

            source.onended = () => {
                if (currentPlayingSource === source) currentPlayingSource = null;
                scheduleNextBuffer();
            };

            currentPlayingSource = source;
            source.start(startTime);

            if (audioQueue.length > 0) {
                const scheduleDelay = Math.max(10, (startTime - currentTime) * 1000 * 0.8);
                setTimeout(() => {
                    if (audioQueue.length > 0) {
                        scheduleNextBuffer();
                    }
                }, scheduleDelay);
            }
        }

        ws.onopen = () => ws.send("request_palette");

        ws.onmessage = async function (event) {
            const data = new Uint8Array(await event.data.arrayBuffer());

            if (data[0] === 2) { // 調色盤數據
                palette = data.slice(1);
            } else if (data[0] === 0 && palette) { // 影像數據
                canvas.width = (data[1] << 24) | (data[2] << 16) | (data[3] << 8) | data[4];
                canvas.height = (data[5] << 24) | (data[6] << 16) | (data[7] << 8) | data[8];
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const pixels = imageData.data;
                const indices = data.slice(9);
                for (let i = 0; i < indices.length; i++) {
                    const idx = indices[i] * 3;
                    const pixelIdx = i * 4;
                    pixels[pixelIdx] = palette[idx];
                    pixels[pixelIdx + 1] = palette[idx + 1];
                    pixels[pixelIdx + 2] = palette[idx + 2];
                    pixels[pixelIdx + 3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
            } else if (data[0] === 3) { // 音頻格式
                const newConfig = {
                    sampleRate: (data[1] << 24) | (data[2] << 16) | (data[3] << 8) | data[4],
                    channels: (data[5] << 24) | (data[6] << 16) | (data[7] << 8) | data[8],
                    bitsPerSample: (data[9] << 24) | (data[10] << 16) | (data[11] << 8) | data[12]
                };

                if (newConfig !== audioConfig) {
                    if (audioCtx) await audioCtx.close();
                    audioConfig = newConfig;
                    audioQueue.length = 0;
                    nextScheduledTime = 0;
                    if (userInteracted) initAudio();
                }
            } else if (data[0] === 1) { // 音頻數據
                if (audioQueue.length > MAX_QUEUE_LENGTH) audioQueue.shift();

                const { sampleRate, channels, bitsPerSample } = audioConfig;
                const audioDataSize = data.length - 1;
                const bytesPerFrame = channels * (bitsPerSample / 8);
                const sampleCount = Math.floor(audioDataSize / bytesPerFrame);

                if (sampleCount > 0) {
                    try {
                        if (!audioCtx) initAudio();
                        const audioBuffer = audioCtx.createBuffer(channels, sampleCount, sampleRate);

                        if (bitsPerSample === 16) {
                            const pcmData = new Int16Array(data.buffer.slice(1));
                            for (let ch = 0; ch < channels; ch++) {
                                const channelData = audioBuffer.getChannelData(ch);
                                for (let i = 0; i < sampleCount; i++) {
                                    channelData[i] = pcmData[i * channels + ch] / 32768;
                                }
                            }
                        } else {
                            const pcmData = new Uint8Array(data.buffer.slice(1));
                            for (let ch = 0; ch < channels; ch++) {
                                const channelData = audioBuffer.getChannelData(ch);
                                for (let i = 0; i < sampleCount; i++) {
                                    channelData[i] = (pcmData[i * channels + ch] - 128) / 128;
                                }
                            }
                        }

                        audioQueue.push({ buffer: audioBuffer });
                        if (!currentPlayingSource && userInteracted) scheduleNextBuffer();
                    } catch (e) {
                        console.error("Audio buffer error:", e);
                    }
                }
            }
        };

        ['keypress', 'mousedown', 'touchstart'].forEach(e => addEventListener(e, initAudioOnUserInteraction, { once: true }));
        // Handle key down event
        document.addEventListener('keydown', function (event) {
            if (!keysPressed.has(event.key)) {
                keysPressed.add(event.key);
                ws.send(`0${event.key}`);
            }
        });

        // Handle key up event
        document.addEventListener('keyup', function (event) {
            if (keysPressed.has(event.key)) {
                keysPressed.delete(event.key);
                ws.send(`1${event.key}`);
            }
        });
    </script>
</body>

</html>
