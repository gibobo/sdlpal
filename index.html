<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Web Game Interface</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            aspect-ratio: 320 / 200;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        let canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        let ws = new WebSocket('ws://localhost:8000/ws');
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
        let sourceNode;
        let palette = null;
        let audioConfig = { sampleRate: 22050, channels: 2, bitsPerSample: 16 };

        function resizeCanvas() {
            const aspectRatio = 320 / 200;
            let width = window.innerWidth;
            let height = window.innerHeight;
            if (width / height > aspectRatio) {
                width = height * aspectRatio;
            } else {
                height = width / aspectRatio;
            }
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        async function updateAudioContext(sampleRate) {
            if (audioCtx.sampleRate !== sampleRate) {
                await audioCtx.close();
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
                console.log(`AudioContext updated to ${sampleRate} Hz`);
            }
        }

        ws.onopen = function () {
            console.log("WebSocket connected");
            ws.send("request_palette");
        };

        ws.onmessage = function (event) {
            console.log("Received message size:", event.data.size);
            event.data.arrayBuffer().then(buffer => {
                const data = new Uint8Array(buffer);
                console.log("First few bytes:", data.slice(0, 10));
                if (data[0] === 2) { // 調色盤數據
                    palette = data.slice(1);
                } else if (data[0] === 0) { // 影像數據
                    if (!palette) {
                        console.warn("No palette, requesting again");
                        ws.send("request_palette");
                        return;
                    }
                    const width = (data[1] << 24) | (data[2] << 16) | (data[3] << 8) | data[4];
                    const height = (data[5] << 24) | (data[6] << 16) | (data[7] << 8) | data[8];
                    canvas.width = width;
                    canvas.height = height;
                    const imageData = ctx.createImageData(width, height);
                    const pixels = imageData.data;
                    const indices = data.slice(9);
                    for (let i = 0; i < indices.length; i++) {
                        const idx = indices[i] * 3;
                        pixels[i * 4 + 0] = palette[idx + 0]; // R
                        pixels[i * 4 + 1] = palette[idx + 1]; // G
                        pixels[i * 4 + 2] = palette[idx + 2]; // B
                        pixels[i * 4 + 3] = 255; // A
                    }
                    ctx.putImageData(imageData, 0, 0);
                } else if (data[0] === 3) { // 音頻格式
                    const sampleRate = (data[1] << 24) | (data[2] << 16) | (data[3] << 8) | data[4];
                    const channels = (data[5] << 24) | (data[6] << 16) | (data[7] << 8) | data[8];
                    const bitsPerSample = (data[9] << 24) | (data[10] << 16) | (data[11] << 8) | data[12];
                    audioConfig = { sampleRate, channels, bitsPerSample };
                    console.log(`Received audio config: ${sampleRate} Hz, ${channels} channels, ${bitsPerSample} bits`);
                    updateAudioContext(sampleRate);
                } else if (data[0] === 1) { // 聲音數據
                    const { sampleRate, channels, bitsPerSample } = audioConfig;
                    const audioBuffer = audioCtx.createBuffer(channels, buffer.byteLength / channels / (bitsPerSample / 8), sampleRate);
                    if (bitsPerSample === 16) {
                        const pcmData = new Int16Array(buffer.slice(1));
                        for (let ch = 0; ch < channels; ch++) {
                            const channelData = audioBuffer.getChannelData(ch);
                            for (let i = 0; i < pcmData.length / channels; i++) {
                                channelData[i] = pcmData[i * channels + ch] / 32768.0;
                            }
                        }
                    } else { // 8 位元
                        const pcmData = new Uint8Array(buffer.slice(1));
                        for (let ch = 0; ch < channels; ch++) {
                            const channelData = audioBuffer.getChannelData(ch);
                            for (let i = 0; i < pcmData.length / channels; i++) {
                                channelData[i] = (pcmData[i * channels + ch] - 128) / 128.0;
                            }
                        }
                    }
                    if (sourceNode) sourceNode.stop();
                    sourceNode = audioCtx.createBufferSource();
                    sourceNode.buffer = audioBuffer;
                    sourceNode.connect(audioCtx.destination);
                    sourceNode.start();
                }
            }).catch(err => {
                console.error("Error reading arrayBuffer:", err);
            });
        };

        document.addEventListener('keydown', function (event) { ws.send('0' + event.key); });
        document.addEventListener('keypress ', function (event) { ws.send('1' + event.key); });
        document.addEventListener('keyup', function (event) { ws.send('2' + event.key); });
    </script>
</body>

</html>
