<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PAL</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            aspect-ratio: 320/200;
            image-rendering: pixelated;
            object-fit: contain;
        }

        /* 搖桿樣式 */
        #joystick-area {
            position: absolute;
            left: 2vw;
            bottom: 8vh;
            width: 120px;
            height: 120px;
            touch-action: none;
            z-index: 20;
            user-select: none;
            /* 防止選取 */
            -webkit-user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
        }

        #joystick-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(100, 100, 100, 0.2);
            border-radius: 50%;
            user-select: none;
            /* 防止選取 */
            -webkit-user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
        }

        #joystick-knob {
            position: absolute;
            left: 40px;
            top: 40px;
            width: 40px;
            height: 40px;
            background: rgba(200, 200, 200, 0.7);
            border-radius: 50%;
            pointer-events: none;
            transition: left 0.05s, top 0.05s;
            user-select: none;
            /* 防止選取 */
            -webkit-user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <div id="joystick-area">
        <div id="joystick-base"></div>
        <div id="joystick-knob"></div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ws = new WebSocket(
            (location.protocol === 'https:' ? 'wss://' : 'ws://') +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            '/ws'
        );
        const keysPressed = new Set();

        let audioCtx, palette, audioConfig = { sampleRate: 44100, channels: 2, bitsPerSample: 16 };
        const audioQueue = [];
        let currentPlayingSource = null, nextScheduledTime = 0;

        function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new (AudioContext || webkitAudioContext)({ sampleRate: audioConfig.sampleRate });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function resizeCanvas() {
            const ratio = 320 / 200;
            let w = innerWidth, h = innerHeight;
            if (w / h > ratio) w = h * ratio;
            else h = w / ratio;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0); // 重設變形
            ctx.imageSmoothingEnabled = true;   // 關閉平滑，保留像素風格
        }
        resizeCanvas();
        addEventListener('resize', resizeCanvas);

        function initAudio() {
            if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)({ sampleRate: audioConfig.sampleRate });
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function scheduleNextBuffer() {
            if (!audioQueue.length || !audioCtx) return;
            const { buffer } = audioQueue.shift();
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            const startTime = Math.max(audioCtx.currentTime + 0.01, nextScheduledTime);
            nextScheduledTime = startTime + buffer.duration;
            source.onended = () => {
                if (currentPlayingSource === source) currentPlayingSource = null;
                scheduleNextBuffer();
            };
            currentPlayingSource = source;
            source.start(startTime);
            if (audioQueue.length) setTimeout(scheduleNextBuffer, 10);
        }

        ws.onmessage = async event => {
            const data = new Uint8Array(await event.data.arrayBuffer());
            if (data[0] === 2) {
                palette = data.slice(1);
            } else if (data[0] === 0 && palette) {
                const gameWidth = (data[1] << 8) | data[2];
                const gameHeight = (data[3] << 8) | data[4];
                const imageData = ctx.createImageData(gameWidth, gameHeight);
                const pixels = imageData.data, indices = data.slice(5);
                for (let i = 0; i < indices.length; i++) {
                    const idx = indices[i] * 3, p = i * 4;
                    pixels[p] = palette[idx];
                    pixels[p + 1] = palette[idx + 1];
                    pixels[p + 2] = palette[idx + 2];
                    pixels[p + 3] = 255;
                }
                const dpr = window.devicePixelRatio || 1;
                const offscreen = document.createElement('canvas');
                offscreen.width = gameWidth;
                offscreen.height = gameHeight;
                offscreen.getContext('2d').putImageData(imageData, 0, 0);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const scale = Math.min(canvas.width / gameWidth, canvas.height / gameHeight);
                const dx = (canvas.width - gameWidth * scale) / 2;
                const dy = (canvas.height - gameHeight * scale) / 2;
                ctx.setTransform(scale, 0, 0, scale, dx, dy);
                ctx.drawImage(offscreen, 0, 0);
            } else if (data[0] === 3) {
                const newConfig = {
                    sampleRate: (data[1] << 8) | data[2],
                    channels: data[3],
                    bitsPerSample: data[4]
                };
                if (JSON.stringify(newConfig) !== JSON.stringify(audioConfig)) {
                    if (audioCtx) await audioCtx.close();
                    audioConfig = newConfig;
                    audioQueue.length = 0;
                    nextScheduledTime = 0;
                    initAudio();
                }
            } else if (data[0] === 1) {
                if (audioQueue.length > 1) audioQueue.shift();
                const { sampleRate, channels, bitsPerSample } = audioConfig;
                const bytesPerFrame = channels * (bitsPerSample / 8);
                const sampleCount = Math.floor((data.length - 1) / bytesPerFrame);
                if (sampleCount > 0) {
                    try {
                        const audioBuffer = audioCtx.createBuffer(channels, sampleCount, sampleRate);
                        if (bitsPerSample === 16) {
                            const pcmData = new Int16Array(data.buffer.slice(1));
                            for (let ch = 0; ch < channels; ch++) {
                                const channelData = audioBuffer.getChannelData(ch);
                                for (let i = 0; i < sampleCount; i++) {
                                    channelData[i] = pcmData[i * channels + ch] / 32768;
                                }
                            }
                        } else {
                            const pcmData = new Uint8Array(data.buffer.slice(1));
                            for (let ch = 0; ch < channels; ch++) {
                                const channelData = audioBuffer.getChannelData(ch);
                                for (let i = 0; i < sampleCount; i++) {
                                    channelData[i] = (pcmData[i * channels + ch] - 128) / 128;
                                }
                            }
                        }
                        audioQueue.push({ buffer: audioBuffer });
                        if (!currentPlayingSource) scheduleNextBuffer();
                    } catch (e) { }
                }
            }
        };

        document.addEventListener('keydown', e => {
            if (keysPressed.has(e.key)) return;
            keysPressed.add(e.key);
            ws.send(`0${e.key}`);
        });
        document.addEventListener('keyup', e => {
            if (!keysPressed.has(e.key)) return;
            keysPressed.delete(e.key);
            ws.send(`1${e.key}`);
        });
        document.addEventListener('keydown', ensureAudioContext);
        document.addEventListener('mousedown', ensureAudioContext);
        document.addEventListener('touchstart', ensureAudioContext);

        const joystickArea = document.getElementById('joystick-area');
        const knob = document.getElementById('joystick-knob');
        const JOYSTICK_THRESHOLD = 20; // 統一門檻值
        const KNOB_RADIUS = 20; // knob 半徑
        let baseRect = joystickArea.getBoundingClientRect();
        let activeDir = null;
        let mouseActive = false;
        let joystickTouchActive = false;
        let touchStartPos = null;

        function getDirection(x, y) {
            const dx = x - baseRect.width / 2;
            const dy = y - baseRect.height / 2;
            if (Math.abs(dx) < JOYSTICK_THRESHOLD &&
                Math.abs(dy) < JOYSTICK_THRESHOLD) {
                return null;
            }
            knob.style.left = (baseRect.width / 2 + dx - KNOB_RADIUS) + 'px';
            knob.style.top = (baseRect.height / 2 + dy - KNOB_RADIUS) + 'px';
            touchStartPos = null;
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            if (angle >= -45 && angle < 45) return 'ArrowRight';
            if (angle >= 45 && angle < 135) return 'ArrowDown';
            if (angle >= -135 && angle < -45) return 'ArrowUp';
            return 'ArrowLeft';
        }

        function sendDirection(dir) {
            if (dir === null) {
                knob.style.left = (baseRect.width / 2 - KNOB_RADIUS) + 'px';
                knob.style.top = (baseRect.height / 2 - KNOB_RADIUS) + 'px';
                if (activeDir !== null) ws.send(`1${activeDir}`);
            }
            else {
                ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].forEach(k => {
                    if (k === dir && activeDir !== dir) ws.send(`0${k}`);
                    else if (k !== dir && activeDir === k) ws.send(`1${k}`);
                });
            }
            activeDir = dir;
        }

        joystickArea.addEventListener('touchstart', e => {
            if (mouseActive) return;
            joystickTouchActive = true;
            const touch = e.touches[0];
            const x = touch.clientX - baseRect.left;
            const y = touch.clientY - baseRect.top;
            touchStartPos = { x, y };
            ws.send(`==> Touch Start`);
            sendDirection(getDirection(x, y));
            e.stopPropagation();
        });
        joystickArea.addEventListener('touchmove', e => {
            touchStartPos = null; // 重設(拖曳非點擊)
            const touch = e.touches[0];
            const x = touch.clientX - baseRect.left;
            const y = touch.clientY - baseRect.top;
            ws.send(`==> Touch Move`);
            sendDirection(getDirection(x, y));
            e.stopPropagation();
        });
        joystickArea.addEventListener('touchend', e => {
            const touch = e.changedTouches[0];
            const x = touch.clientX - baseRect.left;
            const y = touch.clientY - baseRect.top;
            const dx = x - baseRect.width / 2;
            const dy = y - baseRect.height / 2;
            if (Math.abs(dx) < JOYSTICK_THRESHOLD &&
                Math.abs(dy) < JOYSTICK_THRESHOLD &&
                touchStartPos) {
                ws.send('0Escape');
                setTimeout(() => ws.send('1Escape'), 80);
            }
            ws.send(`==> Touch End`);
            sendDirection(null);
            joystickTouchActive = false;
            mouseActive = false;
            touchStartPos = null;
            e.stopPropagation();
        });
        joystickArea.addEventListener('mousedown', e => {
            if (joystickTouchActive) return;
            mouseActive = true;
            const x = e.clientX - baseRect.left;
            const y = e.clientY - baseRect.top;
            touchStartPos = { x, y };
            ws.send(`==> Mouse Start`);
            sendDirection(getDirection(x, y));
        });
        window.addEventListener('mousemove', e => {
            if (!mouseActive) return;
            touchStartPos = null; // 重設(拖曳非點擊)
            const x = e.clientX - baseRect.left;
            const y = e.clientY - baseRect.top;
            ws.send(`==> Mouse Move`);
            sendDirection(getDirection(x, y));
        });
        window.addEventListener('mouseup', e => {
            if (!mouseActive) return;
            const x = e.clientX - baseRect.left;
            const y = e.clientY - baseRect.top;
            const dx = x - baseRect.width / 2;
            const dy = y - baseRect.height / 2;
            if (Math.abs(dx) < JOYSTICK_THRESHOLD &&
                Math.abs(dy) < JOYSTICK_THRESHOLD &&
                touchStartPos) {
                ws.send('0Escape');
                setTimeout(() => ws.send('1Escape'), 80);
            }
            ws.send(`==> Mouse End`);
            sendDirection(null);
            joystickTouchActive = false;
            mouseActive = false;
            touchStartPos = null;
        });

        // 處理畫面左右半邊的點擊/觸控作為確定與取消
        let lastTouchTime = 0;
        const touch_debounce_ms = 200;
        // 只在 touchend 時觸發 Enter（右半邊）與 Escape（joystick中心）
        function handleConfirmCancel(e) {
            let x, y;
            if (e.touches && e.touches.length > 0) {
                x = e.changedTouches ? e.changedTouches[0].clientX : e.touches[0].clientX;
                y = e.changedTouches ? e.changedTouches[0].clientY : e.touches[0].clientY;
            }
            else {
                x = e.clientX;
                y = e.clientY;
            }

            const rect = canvas.getBoundingClientRect();
            const relX = x - rect.left;
            const isRight = relX > rect.width / 2;
            if (isRight) {
                ws.send(`==> Handle Confirm Cancel`);
                const key = 'Enter';
                ws.send('0' + key);
                setTimeout(() => ws.send('1' + key), 80);
            }
        }

        canvas.addEventListener('mouseup', e => { handleConfirmCancel(e); });
        canvas.addEventListener('touchend', e => { handleConfirmCancel(e); });
    </script>
</body>

</html>
