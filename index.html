<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PAL</title>
    <!-- 禁止縮放 -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            /* height: 100vh; 移除這行，避免 iOS Safari 裁切 */
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            /* 新增：防止縮放/滑動 */
        }

        canvas {
            aspect-ratio: 320/200;
            image-rendering: pixelated;
            object-fit: contain;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
        }

        /* 保留 knob 樣式 */
        #joystick-knob {
            position: absolute;
            /* left/top 將由 JS 動態設定 */
            width: 40px;
            height: 40px;
            background: rgba(200, 200, 200, 0.7);
            border-radius: 50%;
            pointer-events: none;
            transition: left 0.05s, top 0.05s;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
            z-index: 30;
        }

        /* 新增搖桿可移動區域的視覺化圓形 */
        #joystick-area-visual {
            position: absolute;
            width: 120px;
            height: 120px;
            left: calc(50% - 60px);
            top: calc(100% - 60px);
            background: rgba(100, 100, 100, 0.18);
            border-radius: 50%;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
            z-index: 20;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <div id="joystick-area-visual"></div>
    <div id="joystick-knob"></div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ws = new WebSocket(
            (location.protocol === 'https:' ? 'wss://' : 'ws://') +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            '/ws'
        );
        const keysPressed = new Set();

        let audioCtx, palette, audioConfig = { sampleRate: 44100, channels: 2, bitsPerSample: 16 };
        const audioQueue = [];
        let currentPlayingSource = null, nextScheduledTime = 0;

        function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new (AudioContext || webkitAudioContext)({ sampleRate: audioConfig.sampleRate });
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function resizeCanvas() {
            const ratio = 320 / 200;
            let w = window.innerWidth;
            let h = window.innerHeight;
            // 以高度為主，寬度不能超過比例
            if (w / h > ratio) {
                w = h * ratio;
            } else {
                h = w / ratio;
            }
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0); // 重設變形
            ctx.imageSmoothingEnabled = true;   // 關閉平滑，保留像素風格
        }
        resizeCanvas();
        addEventListener('resize', resizeCanvas);

        function initAudio() {
            if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)({ sampleRate: audioConfig.sampleRate });
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function scheduleNextBuffer() {
            if (!audioQueue.length || !audioCtx) return;
            const { buffer } = audioQueue.shift();
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            const startTime = Math.max(audioCtx.currentTime + 0.01, nextScheduledTime);
            nextScheduledTime = startTime + buffer.duration;
            source.onended = () => {
                if (currentPlayingSource === source) currentPlayingSource = null;
                scheduleNextBuffer();
            };
            currentPlayingSource = source;
            source.start(startTime);
            if (audioQueue.length) setTimeout(scheduleNextBuffer, 10);
        }

        ws.onmessage = async event => {
            const data = new Uint8Array(await event.data.arrayBuffer());
            if (data[0] === 2) {
                palette = data.slice(1);
            } else if (data[0] === 0 && palette) {
                const gameWidth = (data[1] << 8) | data[2];
                const gameHeight = (data[3] << 8) | data[4];
                const imageData = ctx.createImageData(gameWidth, gameHeight);
                const pixels = imageData.data, indices = data.slice(5);
                for (let i = 0; i < indices.length; i++) {
                    const idx = indices[i] * 3, p = i * 4;
                    pixels[p] = palette[idx];
                    pixels[p + 1] = palette[idx + 1];
                    pixels[p + 2] = palette[idx + 2];
                    pixels[p + 3] = 255;
                }
                const dpr = window.devicePixelRatio || 1;
                const offscreen = document.createElement('canvas');
                offscreen.width = gameWidth;
                offscreen.height = gameHeight;
                offscreen.getContext('2d').putImageData(imageData, 0, 0);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const scale = Math.min(canvas.width / gameWidth, canvas.height / gameHeight);
                const dx = (canvas.width - gameWidth * scale) / 2;
                const dy = (canvas.height - gameHeight * scale) / 2;
                ctx.setTransform(scale, 0, 0, scale, dx, dy);
                ctx.drawImage(offscreen, 0, 0);
            } else if (data[0] === 3) {
                const newConfig = {
                    sampleRate: (data[1] << 8) | data[2],
                    channels: data[3],
                    bitsPerSample: data[4]
                };
                if (JSON.stringify(newConfig) !== JSON.stringify(audioConfig)) {
                    if (audioCtx) await audioCtx.close();
                    audioConfig = newConfig;
                    audioQueue.length = 0;
                    nextScheduledTime = 0;
                    initAudio();
                }
            } else if (data[0] === 1) {
                if (audioQueue.length > 1) audioQueue.shift();
                const { sampleRate, channels, bitsPerSample } = audioConfig;
                const bytesPerFrame = channels * (bitsPerSample / 8);
                const sampleCount = Math.floor((data.length - 1) / bytesPerFrame);
                if (sampleCount > 0) {
                    try {
                        const audioBuffer = audioCtx.createBuffer(channels, sampleCount, sampleRate);
                        if (bitsPerSample === 16) {
                            const pcmData = new Int16Array(data.buffer.slice(1));
                            for (let ch = 0; ch < channels; ch++) {
                                const channelData = audioBuffer.getChannelData(ch);
                                for (let i = 0; i < sampleCount; i++) {
                                    channelData[i] = pcmData[i * channels + ch] / 32768;
                                }
                            }
                        } else {
                            const pcmData = new Uint8Array(data.buffer.slice(1));
                            for (let ch = 0; ch < channels; ch++) {
                                const channelData = audioBuffer.getChannelData(ch);
                                for (let i = 0; i < sampleCount; i++) {
                                    channelData[i] = (pcmData[i * channels + ch] - 128) / 128;
                                }
                            }
                        }
                        audioQueue.push({ buffer: audioBuffer });
                        if (!currentPlayingSource) scheduleNextBuffer();
                    } catch (e) { }
                }
            }
        };

        document.addEventListener('keydown', e => {
            if (keysPressed.has(e.key)) return;
            keysPressed.add(e.key);
            ws.send(`0${e.key}`);
        });
        document.addEventListener('keyup', e => {
            if (!keysPressed.has(e.key)) return;
            keysPressed.delete(e.key);
            ws.send(`1${e.key}`);
        });
        document.addEventListener('keydown', ensureAudioContext);
        document.addEventListener('mousedown', ensureAudioContext);
        document.addEventListener('touchstart', ensureAudioContext);

        const knob = document.getElementById('joystick-knob');
        const areaVisual = document.getElementById('joystick-area-visual');
        const KNOB_RADIUS = knob.getBoundingClientRect().width / 2; // knob 半徑
        const JOYSTICK_THRESHOLD = 20; // 搖桿觸發閾值
        const JOYSTICK_RADIUS = 60; // 搖桿半徑
        let JoystickCenter = getJoystickCenter();
        let activeDir = null;
        let mouseActive = false;
        let touchActive = false;
        let touchStartPos = null;
        let joystickTouchId = null; // 追蹤搖桿手指 id
        let dragStartPos = null; // 拖曳起始位置
        let lastDragDirection = null; // 上次拖曳方向
        let dragMoveCount = 0; // 拖曳移動計數器
        let lastWheelTime = 0; // 上次滾輪事件時間
        const WHEEL_THROTTLE_DELAY = 150; // 滾輪防抖延遲（毫秒）

        function getJoystickCenter() {
            const x = window.innerWidth * 0.10 + JOYSTICK_RADIUS;
            const y = window.innerHeight * 0.90 - JOYSTICK_RADIUS;
            return { x, y };
        }

        function resetKnobPosition() {
            JoystickCenter = getJoystickCenter();
            knob.style.left = JoystickCenter.x - KNOB_RADIUS + 'px';
            knob.style.top = JoystickCenter.y - KNOB_RADIUS + 'px';
            areaVisual.style.width = (JOYSTICK_RADIUS * 2) + 'px';
            areaVisual.style.height = (JOYSTICK_RADIUS * 2) + 'px';
            areaVisual.style.left = (JoystickCenter.x - JOYSTICK_RADIUS) + 'px';
            areaVisual.style.top = (JoystickCenter.y - JOYSTICK_RADIUS) + 'px';
        }

        function getDirection(x, y) {
            const dx = x - JoystickCenter.x;
            const dy = y - JoystickCenter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < JOYSTICK_THRESHOLD)
                return null;

            touchStartPos = null;
            let angle = Math.atan2(dy, dx);
            knob.style.left = (JoystickCenter.x + (Math.cos(angle) * Math.min(distance, JOYSTICK_RADIUS)) - KNOB_RADIUS) + 'px';
            knob.style.top = (JoystickCenter.y + (Math.sin(angle) * Math.min(distance, JOYSTICK_RADIUS)) - KNOB_RADIUS) + 'px';
            if (angle >= -Math.PI / 4 && angle < Math.PI / 4) return 'ArrowRight';
            if (angle >= Math.PI / 4 && angle < 3 * Math.PI / 4) return 'ArrowDown';
            if (angle >= -3 * Math.PI / 4 && angle < -Math.PI / 4) return 'ArrowUp';
            return 'ArrowLeft';
        }

        function sendDirection(dir) {
            if (activeDir !== dir) {
                if (activeDir !== null)
                    ws.send(`1${activeDir}`); // 先鬆開前一個方向

                if (dir === null)
                    resetKnobPosition();    // 重設搖桿位置
                else
                    ws.send(`0${dir}`); // 再按下新方向
            }
            activeDir = dir;
        }

        function sendCommand(cmd) {
            ws.send(`0${cmd}`);
            ws.send(`1${cmd}`);
        }

        // 獲取遊戲畫面中心點
        function getGameCenter() {
            const canvasRect = canvas.getBoundingClientRect();
            return {
                x: canvasRect.left + canvasRect.width / 2,
                y: canvasRect.top + canvasRect.height / 2
            };
        }

        // 基於遊戲畫面中心的方向判斷函數
        function getDirectionFromCenter(currentX, currentY) {
            const center = getGameCenter();
            const dx = currentX - center.x;
            const dy = currentY - center.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 距離太小，不判斷方向（死區）
            if (distance < 30) return null;
            
            // 計算角度
            let angle = Math.atan2(dy, dx);
            let direction = null;
            
            if (angle >= -Math.PI / 4 && angle < Math.PI / 4) direction = 'ArrowRight';
            else if (angle >= Math.PI / 4 && angle < 3 * Math.PI / 4) direction = 'ArrowDown';
            else if (angle >= -3 * Math.PI / 4 && angle < -Math.PI / 4) direction = 'ArrowUp';
            else direction = 'ArrowLeft';
            
            return direction;
        }

        // 重設拖曳狀態
        function resetDragState() {
            dragStartPos = null;
            lastDragDirection = null;
            dragMoveCount = 0;
        }

        function handleConfirmCancel(x, y) {
            ws.send(`==> Handle Confirm Cancel`);
            const canvasRect = canvas.getBoundingClientRect();
            const isRight = x > (canvasRect.left + canvasRect.width / 2);
            if (touchStartPos) {
                sendCommand('Escape');
                touchStartPos = null;
            }
            else if (isRight) {
                sendCommand('Enter');
            }
        }

        window.addEventListener('touchstart', e => {
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const x = touch.clientX;
                const y = touch.clientY;
                if (joystickTouchId === null &&
                    Math.abs(x - JoystickCenter.x) < JOYSTICK_RADIUS &&
                    Math.abs(y - JoystickCenter.y) < JOYSTICK_RADIUS) {
                    joystickTouchId = touch.identifier;
                    touchStartPos = { x, y };
                    sendDirection(getDirection(x, y));
                    ws.send(`==> Touch Start (joystick)  ${touch.identifier}`);
                } else {
                    ws.send(`==> Touch Start (command)  ${touch.identifier}`);
                }
            }
            touchActive = true;
            e.stopPropagation();
        });
        window.addEventListener('touchmove', e => {
            if (joystickTouchId !== null) {
                // 找到搖桿手指
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    if (touch.identifier === joystickTouchId) {
                        const x = touch.clientX;
                        const y = touch.clientY;
                        touchStartPos = null;
                        sendDirection(getDirection(x, y));
                        break;
                    }
                }
            }
            e.stopPropagation();
        });
        window.addEventListener('touchend', e => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === joystickTouchId) { // 如果是搖桿手指
                    ws.send(`==> Touch End (joystick) ${t.identifier}`);
                    if (touchStartPos)
                        sendCommand('Escape');
                    else
                        sendDirection(null);
                    joystickTouchId = null; // 重設搖桿手指 ID
                    touchStartPos = null; // 重設觸控起始位置
                } else { // 如果是其他手指
                    ws.send(`==> Touch End (command) ${t.identifier}`);
                    sendCommand('Enter');
                }
            }
            e.stopPropagation();
        });
        window.addEventListener('mousedown', e => {
            if (touchActive) return;
            
            // 阻止事件冒泡和預設行為，防止附加元件干擾
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            
            const x = e.clientX;
            const y = e.clientY;
            ws.send(`==> Mouse Start`);
            
            if (e.button === 0) { // 左鍵
                mouseActive = true;
                touchStartPos = { x, y };
                
                if (Math.abs(x - JoystickCenter.x) < JOYSTICK_RADIUS &&
                    Math.abs(y - JoystickCenter.y) < JOYSTICK_RADIUS) {
                    // 在搖桿區域內 - 立即使用搖桿模式
                    sendDirection(getDirection(x, y));
                    resetDragState(); // 重設拖曳狀態
                } else {
                    // 在搖桿區域外 - 先不發送任何命令，等待 mousemove 或 mouseup
                    ws.send(`==> Mouse: Outside joystick area, waiting for move/up`);
                }
            } else if (e.button === 1) { // 中鍵（滾輪按鈕）
                if (Math.abs(x - JoystickCenter.x) >= JOYSTICK_RADIUS ||
                    Math.abs(y - JoystickCenter.y) >= JOYSTICK_RADIUS) {
                    // 在搖桿區域外 - 根據中心位置發送方向命令
                    const direction = getDirectionFromCenter(x, y);
                    if (direction) {
                        ws.send(`==> Mouse: Middle click outside joystick area at (${x}, ${y}) -> ${direction}`);
                        sendDirection(direction); // 使用 sendDirection 而不是 sendCommand
                        mouseActive = true; // 標記滑鼠為活動狀態以維持方向控制
                        touchStartPos = { x, y }; // 設置起始位置
                    } else {
                        ws.send(`==> Mouse: Middle click outside joystick area at (${x}, ${y}) -> too close to center, no direction`);
                    }
                } else {
                    // 在搖桿區域內 - 發送 Escape
                    ws.send(`==> Mouse: Middle click in joystick area -> Escape`);
                    sendCommand('Escape');
                }
            } else if (e.button === 2) { // 右鍵
                // 右鍵立即發送 Escape
                ws.send(`==> Mouse: Right click -> Escape`);
                sendCommand('Escape');
            }
        });
        window.addEventListener('mousemove', e => {
            if (touchActive || !mouseActive) return; // 只在滑鼠按下時才處理
            
            // 阻止事件冒泡和預設行為
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            
            const x = e.clientX;
            const y = e.clientY;
            
            if (Math.abs(x - JoystickCenter.x) < JOYSTICK_RADIUS &&
                Math.abs(y - JoystickCenter.y) < JOYSTICK_RADIUS) {
                // 在搖桿區域內，使用搖桿邏輯
                ws.send(`==> Mouse Move (joystick)`);
                touchStartPos = null; // 清除點擊狀態，表示進入拖曳模式
                sendDirection(getDirection(x, y));
            } else {
                // 在搖桿區域外，檢查是否有移動（拖曳）
                if (touchStartPos) {
                    const dx = x - touchStartPos.x;
                    const dy = y - touchStartPos.y;
                    const moveDistance = Math.sqrt(dx * dx + dy * dy);
                    
                    // 如果移動距離超過閾值，進入方向控制模式
                    if (moveDistance > 10) {
                        ws.send(`==> Mouse Move: Started dragging outside joystick (distance: ${moveDistance})`);
                        touchStartPos = null; // 清除點擊狀態，表示進入拖曳模式
                        
                        // 使用遊戲畫面中心為基準的方向判斷
                        const direction = getDirectionFromCenter(x, y);
                        if (direction) {
                            sendDirection(direction);
                        }
                    }
                } else {
                    // 已經在拖曳模式中，繼續發送方向命令
                    ws.send(`==> Mouse Move: Continue dragging outside joystick`);
                    const direction = getDirectionFromCenter(x, y);
                    if (direction) {
                        sendDirection(direction);
                    }
                }
            }
        });
        window.addEventListener('mouseup', e => {
            if (touchActive) return;
            
            // 阻止事件冒泡和預設行為
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            
            const x = e.clientX;
            const y = e.clientY;
            ws.send(`==> Mouse End (button: ${e.button})`);
            
            if (mouseActive) {
                if (e.button === 1) {
                    // 中鍵釋放 - 只需停止方向輸入
                    ws.send(`==> Mouse: Middle button release -> stop direction`);
                    sendDirection(null);
                } else if (e.button === 0) {
                    // 左鍵釋放
                    if (touchStartPos) {
                        // 如果還有 touchStartPos，表示是短按點擊（沒有拖曳）
                        if (Math.abs(x - JoystickCenter.x) < JOYSTICK_RADIUS &&
                            Math.abs(y - JoystickCenter.y) < JOYSTICK_RADIUS) {
                            // 在搖桿區域內點擊 - 發送 Escape
                            ws.send(`==> Mouse: Short click in joystick area -> Escape`);
                            sendCommand('Escape');
                        } else {
                            // 在搖桿區域外點擊 - 發送 Enter
                            ws.send(`==> Mouse: Short click outside joystick area -> Enter`);
                            sendCommand('Enter');
                        }
                    } else {
                        // touchStartPos 已被清除，表示是拖曳操作，只停止方向輸入
                        ws.send(`==> Mouse: End of drag operation`);
                    }
                    
                    // 停止方向輸入
                    sendDirection(null);
                } else if (e.button === 2) {
                    // 右鍵釋放 - 右鍵在 mousedown 時已經發送了 Escape，這裡不需要額外處理
                    ws.send(`==> Mouse: Right button release`);
                }
            }
            
            mouseActive = false;
            touchStartPos = null;
        });

        // 防止 iOS Safari 雙指縮放
        window.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        
        // 強化禁用右鍵選單和防止附加元件干擾
        window.addEventListener('contextmenu', function (e) { 
            e.preventDefault(); 
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }, { capture: true });
        
        // 禁用拖放功能，防止某些附加元件誤觸發
        window.addEventListener('dragstart', function (e) { 
            e.preventDefault(); 
            e.stopPropagation();
            return false;
        }, { capture: true });
        
        window.addEventListener('drop', function (e) { 
            e.preventDefault(); 
            e.stopPropagation();
            return false;
        }, { capture: true });
        
        window.addEventListener('dragover', function (e) { 
            e.preventDefault(); 
            e.stopPropagation();
            return false;
        }, { capture: true });
        
        // 防止選取文字（某些附加元件可能會在選取時觸發）
        window.addEventListener('selectstart', function (e) { 
            e.preventDefault(); 
            return false;
        }, { capture: true });
        
        // 滑鼠滾輪事件處理
        window.addEventListener('wheel', function (e) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            
            // 防抖機制 - 限制滾輪事件觸發頻率
            const currentTime = Date.now();
            if (currentTime - lastWheelTime < WHEEL_THROTTLE_DELAY) {
                ws.send(`==> Wheel: Throttled (${currentTime - lastWheelTime}ms since last)`);
                return false;
            }
            lastWheelTime = currentTime;
            
            const deltaY = e.deltaY;
            const deltaX = e.deltaX;
            let command = null;
            
            // 檢查是否主要是水平滾動
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // 水平滾動（左右撥動）
                if (deltaX < 0) {
                    // 向左撥動 - 發送 ArrowLeft
                    command = 'ArrowLeft';
                    ws.send(`==> Wheel: Left Scroll (${deltaX}, mode: ${e.deltaMode}) -> ArrowLeft`);
                } else if (deltaX > 0) {
                    // 向右撥動 - 發送 ArrowRight
                    command = 'ArrowRight';
                    ws.send(`==> Wheel: Right Scroll (${deltaX}, mode: ${e.deltaMode}) -> ArrowRight`);
                }
            } else {
                // 垂直滾動（上下滾動）
                if (deltaY < 0) {
                    // 向上滾動 - 發送 ArrowUp
                    command = 'ArrowUp';
                    ws.send(`==> Wheel: Up Scroll (${deltaY}, mode: ${e.deltaMode}) -> ArrowUp`);
                } else if (deltaY > 0) {
                    // 向下滾動 - 發送 ArrowDown
                    command = 'ArrowDown';
                    ws.send(`==> Wheel: Down Scroll (${deltaY}, mode: ${e.deltaMode}) -> ArrowDown`);
                }
            }
            
            if (command) {
                sendCommand(command);
            }
            
            return false;
        }, { passive: false, capture: true });
        window.addEventListener('resize', () => { resetKnobPosition(); });
        // 新增：監聽設備旋轉
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                resizeCanvas();
                resetKnobPosition();
            }, 300); // 延遲執行，確保螢幕尺寸已更新
        });
        resetKnobPosition();
    </script>
</body>

</html>
